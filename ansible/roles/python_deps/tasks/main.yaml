- name: Ensure uv is installed globally
  ansible.builtin.pip:
    name: uv
    state: present
    executable: pip3
    extra_args: "--break-system-packages"
  become: yes

- name: Get path to uv
  ansible.builtin.command: which uv
  register: uv_path
  changed_when: false
  become: yes

- name: Create a virtual environment for the application
  ansible.builtin.command:
    cmd: "{{ uv_path.stdout }} venv --seed /opt/pipecatapp/venv"
    creates: "/opt/pipecatapp/venv/bin/pip"
  environment:
    UV_LINK_MODE: "hardlink"
  become: yes
  tags:
    - deploy_app

- name: Ensure correct ownership of the virtual environment
  ansible.builtin.file:
    path: "/opt/pipecatapp/venv"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    recurse: yes
  become: yes
  tags:
    - deploy_app

- name: Copy requirements.txt to the application directory
  copy:
    src: requirements.txt
    dest: "/opt/pipecatapp/requirements.txt"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  become: yes
  tags:
    - deploy_app

- name: Create a persistent temporary directory for pip builds
  ansible.builtin.file:
    path: /var/tmp/ansible_pip_build
    state: directory
    mode: '0777'
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  become: yes
  tags:
    - deploy_app

- name: Create a temporary cache directory for uv builds
  ansible.builtin.file:
    path: /var/tmp/ansible_pip_build/uv_cache
    state: directory
    mode: '0777'
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  become: yes
  tags:
    - deploy_app

- name: Install/Upgrade base python packages, Cython, and uv in venv
  ansible.builtin.command:
    cmd: "{{ uv_path.stdout }} pip install pip setuptools wheel cython uv"
  environment:
    UV_LINK_MODE: "hardlink"
    VIRTUAL_ENV: "/opt/pipecatapp/venv"
    TMPDIR: /var/tmp/ansible_pip_build
    UV_CACHE_DIR: /var/tmp/ansible_pip_build/uv_cache
  become: yes
  become_user: "{{ target_user }}"
  tags:
    - deploy_app

- name: Pre-install webrtcvad explicitly
  ansible.builtin.command:
    cmd: "{{ uv_path.stdout }} pip install webrtcvad-wheels==2.0.14"
  environment:
    UV_LINK_MODE: "hardlink"
    VIRTUAL_ENV: "/opt/pipecatapp/venv"
    TMPDIR: /var/tmp/ansible_pip_build
    UV_CACHE_DIR: /var/tmp/ansible_pip_build/uv_cache
  become: yes
  become_user: "{{ target_user }}"
  tags:
    - deploy_app

- name: Clean up uv cache after webrtcvad installation
  ansible.builtin.command:
    cmd: "{{ uv_path.stdout }} cache prune"
  environment:
    UV_CACHE_DIR: /var/tmp/ansible_pip_build/uv_cache
  become: yes
  become_user: "{{ target_user }}"
  tags:
    - deploy_app

- name: Install python dependencies with uv
  ansible.builtin.command:
    cmd: "{{ uv_path.stdout }} pip install -r /opt/pipecatapp/requirements.txt"
  environment:
    UV_LINK_MODE: "hardlink"
    VIRTUAL_ENV: "/opt/pipecatapp/venv"
    TMPDIR: /var/tmp/ansible_pip_build
    UV_CACHE_DIR: /var/tmp/ansible_pip_build/uv_cache
    CFLAGS: "-I/usr/include/python3.12 -I/usr/include/python3.13"
    C_INCLUDE_PATH: "/usr/include/python3.12:/usr/include/python3.13"
    CPLUS_INCLUDE_PATH: "/usr/include/python3.12:/usr/include/python3.13"
  async: 1200 # Should be sufficient with uv
  poll: 10
  become: yes
  become_user: "{{ target_user }}"
  tags:
    - deploy_app

- name: Verify llm_sandbox installation
  ansible.builtin.command:
    cmd: "/opt/pipecatapp/venv/bin/python3 -c 'import llm_sandbox'"
  become: yes
  become_user: "{{ target_user }}"
  tags:
    - deploy_app



- name: Clean up uv cache
  ansible.builtin.command:
    cmd: "{{ uv_path.stdout }} cache prune"
  environment:
    UV_CACHE_DIR: /var/tmp/ansible_pip_build/uv_cache
  become: yes
  become_user: "{{ target_user }}"
  tags:
    - deploy_app

- name: Clean up pip build directory
  ansible.builtin.file:
    path: /var/tmp/ansible_pip_build
    state: absent
  become: yes
  tags:
    - deploy_app
