- name: Ensure network facts are gathered
  ansible.builtin.setup:
    gather_subset:
      - network
  when: ansible_interfaces is not defined

- name: Auto-detect PXE network interface per machine
  ansible.builtin.set_fact:
    pxe_interface: >-
      {%- set matching_iface = namespace(name='') -%}
      {%- if pxe_interface is defined and pxe_interface | string | length > 0 and pxe_interface in (ansible_interfaces | default([])) -%}
        {{ pxe_interface }}
      {%- else -%}
        {%- if pxe_server_ip is defined and pxe_server_ip in (ansible_all_ipv4_addresses | default([])) -%}
          {%- for iface in ansible_interfaces | default([]) -%}
            {%- set iface_key = 'ansible_' + (iface | replace('-', '_')) -%}
            {%- set iface_data = hostvars[inventory_hostname][iface_key] | default({}) -%}
            {%- if iface_data.ipv4 is defined and iface_data.ipv4.address == pxe_server_ip -%}
              {%- set matching_iface.name = iface -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {%- if matching_iface.name != '' -%}
          {{ matching_iface.name }}
        {%- elif ansible_default_ipv4.interface is defined and ansible_default_ipv4.interface | string | length > 0 -%}
          {{ ansible_default_ipv4.interface }}
        {%- else -%}
          {{ (ansible_interfaces | default([]) | reject('equalto', 'lo') | first) | default('eth0') }}
        {%- endif -%}
      {%- endif -%}

- name: Display detected PXE interface
  ansible.builtin.debug:
    msg: "Configuring PXE server on interface '{{ pxe_interface }}' for host '{{ inventory_hostname }}'"

- name: Install PXE boot dependencies
  apt:
    name:
      - isc-dhcp-server
      - tftpd-hpa
      - nginx
    state: present
  become: yes

- name: Create TFTP root directory
  file:
    path: /srv/tftp
    state: directory
    mode: '0755'
  become: yes
  check_mode: no

- name: Download and extract Debian netboot files
  unarchive:
    src: "https://ftp.debian.org/debian/dists/stable/main/installer-amd64/current/images/netboot/netboot.tar.gz"
    dest: /srv/tftp
    remote_src: yes
  become: yes
  check_mode: no

- name: Download iPXE BIOS bootloader
  get_url:
    url: https://boot.ipxe.org/undionly.kpxe
    dest: "{{ tftp_root }}/undionly.kpxe"
    mode: '0644'
  become: yes

- name: Download iPXE UEFI bootloader
  get_url:
    url: https://boot.ipxe.org/x86_64-efi/ipxe.efi
    dest: "{{ tftp_root }}/ipxe.efi"
    mode: '0644'
  become: yes

- name: Configure isc-dhcp-server interfaces
  lineinfile:
    path: /etc/default/isc-dhcp-server
    regexp: '^INTERFACESv4='
    line: 'INTERFACESv4="{{ pxe_interface }}"'
  become: yes

- name: Ensure isc-dhcp-server IPv6 interface is empty
  lineinfile:
    path: /etc/default/isc-dhcp-server
    regexp: '^INTERFACESv6='
    line: 'INTERFACESv6=""'
  become: yes

- name: Configure tftpd-hpa defaults
  lineinfile:
    path: /etc/default/tftpd-hpa
    regexp: '^TFTP_DIRECTORY='
    line: 'TFTP_DIRECTORY="/srv/tftp"'
  become: yes

- name: Copy DHCP config
  template:
    src: dhcpd.conf.j2
    dest: /etc/dhcp/dhcpd.conf
  notify: restart dhcpd
  become: yes

- name: Validate DHCP configuration syntax
  command: dhcpd -t -cf /etc/dhcp/dhcpd.conf
  changed_when: false
  become: yes

- name: Copy preseed file to TFTP root (for legacy compatibility)
  template:
    src: preseed.cfg.j2
    dest: "{{ tftp_root }}/preseed.cfg"
  become: yes

- name: Create web root directory
  file:
    path: /var/www/html
    state: directory
    mode: '0755'
  become: yes

- name: Symlink Debian installer files to web root
  file:
    src: "{{ tftp_root }}/debian-installer/amd64/"
    dest: /var/www/html/debian
    state: link
    force: yes
  become: yes

- name: Copy preseed file to web root
  template:
    src: preseed.cfg.j2
    dest: /var/www/html/preseed.cfg
    mode: '0644'
  become: yes

- name: Copy iPXE boot script to web root
  template:
    src: boot.ipxe.j2
    dest: /var/www/html/boot.ipxe
    mode: '0644'
  become: yes

- name: Ensure tftpd-hpa is enabled and running
  systemd:
    name: tftpd-hpa
    enabled: yes
    state: started
  become: yes

- name: Ensure nginx is enabled and running
  systemd:
    name: nginx
    enabled: yes
    state: started
  become: yes

- name: Ensure isc-dhcp-server is enabled and running
  systemd:
    name: isc-dhcp-server
    enabled: yes
    state: started
  become: yes
