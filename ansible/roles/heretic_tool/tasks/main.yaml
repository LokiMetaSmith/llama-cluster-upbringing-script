- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    update_cache_retries: 10
    update_cache_retry_max_delay: 15
    cache_valid_time: 3600
  become: yes

- name: Placeholder for GPU dependencies
  ansible.builtin.debug:
    msg: "NOTE: The heretic tool requires a GPU and the appropriate drivers (e.g., NVIDIA drivers and CUDA) to be installed on the host. This role does not install them."

- name: Ensure uv is installed globally
  ansible.builtin.pip:
    name: uv
    state: present
    executable: pip3
    extra_args: "--break-system-packages"
  become: yes
  ignore_errors: yes

- name: Get path to uv
  ansible.builtin.command: which uv
  register: uv_path
  changed_when: false
  failed_when: false
  become: yes

- name: Ensure temporary build directory exists with correct permissions
  ansible.builtin.file:
    path: /var/tmp/pipecat_build
    state: directory
    mode: '1777'
  become: yes

- name: Create heretic tool directory
  ansible.builtin.file:
    path: "{{ heretic_tool_dir }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  become: yes

- name: Create heretic tool virtual environment
  ansible.builtin.command:
    cmd: "{{ uv_path.stdout | default('uv', true) }} venv --seed {{ heretic_tool_venv_dir }}"
    creates: "{{ heretic_tool_venv_dir }}/bin/activate"
  environment:
    UV_LINK_MODE: "hardlink"
  become: yes
  become_user: "{{ target_user }}"

- name: Install heretic-llm
  ansible.builtin.command:
    cmd: "{{ uv_path.stdout | default('uv', true) }} pip install heretic-llm"
  environment:
    UV_LINK_MODE: "hardlink"
    VIRTUAL_ENV: "{{ heretic_tool_venv_dir }}"
  become: yes
  become_user: "{{ target_user }}"
