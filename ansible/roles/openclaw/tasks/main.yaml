---
- name: Check if Nomad CLI cert exists
  ansible.builtin.stat:
    path: "{{ nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.cert.pem' }}"
  register: nomad_cli_cert_stat

- name: Set nomad_protocol fact
  ansible.builtin.set_fact:
    nomad_protocol: "{{ \"https\" if nomad_cli_cert_stat.stat.exists else \"http\" }}"

- name: Create OpenClaw directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ target_user | default('root') }}"
    group: "{{ target_user | default('root') }}"
  loop:
    - /opt/openclaw
    - /opt/openclaw/config
    - /opt/openclaw/data
    - /opt/openclaw/skills/pipecat
    - /opt/openclaw/docker
    - "{{ openclaw_workspace_dir | default('/var/lib/openclaw/workspace') }}"
    - "{{ openclaw_takeout_mount_dir | default('/mnt/takeout-hoard') }}"

- name: Check if Google Takeout archive exists on controller/target
  stat:
    path: "{{ openclaw_takeout_source_zip | default('/tmp/takeout-archive.zip') }}"
  register: takeout_archive_stat

- name: Unpack Google Takeout archive into host mount volume
  unarchive:
    src: "{{ openclaw_takeout_source_zip | default('/tmp/takeout-archive.zip') }}"
    dest: "{{ openclaw_takeout_mount_dir | default('/mnt/takeout-hoard') }}"
    remote_src: true
    owner: "{{ target_user | default('root') }}"
    group: "{{ target_user | default('root') }}"
    mode: '0644'
  when: takeout_archive_stat.stat.exists

- name: Copy OpenClaw Dockerfile
  ansible.builtin.copy:
    src: Dockerfile
    dest: /opt/openclaw/docker/Dockerfile
    mode: '0644'
    owner: "{{ target_user | default('root') }}"
    group: "{{ target_user | default('root') }}"

- name: Prune Docker system to free up space
  ansible.builtin.command: docker system prune -f -a --volumes
  become: yes
  changed_when: true

- name: Prune Docker volumes
  ansible.builtin.command: docker volume prune -f
  become: yes
  changed_when: true

- name: Build OpenClaw Docker image
  ansible.builtin.command: docker build -t openclaw:latest .
  args:
    chdir: /opt/openclaw/docker
  changed_when: true

- name: Export OpenClaw image and pin to IPFS
  ansible.builtin.shell: "set -o pipefail; docker save openclaw:latest | ipfs --api /ip4/{{ cluster_ip | default('127.0.0.1') }}/tcp/{{ ipfs_api_port | default(5001) }} add -Q -"
  args:
    executable: /bin/bash
  become: yes
  register: ipfs_add_result_openclaw
  until: ipfs_add_result_openclaw is success
  retries: 3
  delay: 10
  environment:
    IPFS_PATH: "{{ ipfs_path }}"

- name: Set openclaw_ipfs_cid fact
  ansible.builtin.set_fact:
    openclaw_ipfs_cid: "{{ ipfs_add_result_openclaw.stdout }}"

- name: Copy Pipecat Skill
  ansible.builtin.copy:
    src: pipecat_skill.md
    dest: /opt/openclaw/skills/pipecat/SKILL.md
    mode: '0644'
    owner: "{{ target_user | default('root') }}"
    group: "{{ target_user | default('root') }}"

- name: Template OpenClaw Nomad job file
  ansible.builtin.template:
    src: openclaw.nomad.j2
    dest: "{{ nomad_jobs_dir | default('/opt/nomad/jobs') }}/openclaw.nomad"
    mode: '0644'

- name: Ensure Nomad scripts directory exists
  ansible.builtin.file:
    path: /etc/nomad.d/scripts
    state: directory
    mode: '0755'
    owner: "{{ target_user | default('root') }}"
    group: "{{ target_user | default('root') }}"

- name: Template post-deployment verification script
  template:
    src: "verify_openclaw.sh.j2"
    dest: "/etc/nomad.d/scripts/verify_openclaw.sh"
    owner: "root"
    group: "root"
    mode: '0755'

- name: Run OpenClaw Nomad job
  ansible.builtin.command:
    cmd: "/usr/local/bin/nomad job run -detach {{ nomad_jobs_dir | default('/opt/nomad/jobs') }}/openclaw.nomad"
  environment:
    NOMAD_ADDR: "{{ nomad_protocol | default('https') }}://{{ cluster_ip | default('127.0.0.1') }}:{{ nomad_http_port | default(4646) }}"
    NOMAD_CACERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/ca.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
    NOMAD_CLIENT_CERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.cert.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
    NOMAD_CLIENT_KEY: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.key.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
  register: openclaw_job_run
  changed_when: true

- name: Execute post-deployment verification script across cluster nodes
  shell: |
    bash /etc/nomad.d/scripts/verify_openclaw.sh
  register: verification_result
  changed_when: false
  ignore_errors: true

- name: Display verification output
  debug:
    msg: "{{ verification_result.stdout_lines }}"
