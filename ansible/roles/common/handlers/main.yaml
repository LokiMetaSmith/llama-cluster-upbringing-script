- name: restart systemd-logind
  systemd:
    name: systemd-logind.service
    state: restarted

- name: restart cluster-ip-alias
  systemd:
    name: cluster-ip-alias.service
    state: restarted
    daemon_reload: yes
  when: not ansible_check_mode

- name: restart ssh
  service:
    name: ssh
    state: restarted
