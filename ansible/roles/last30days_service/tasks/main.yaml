- name: Check if Nomad CLI cert exists
  ansible.builtin.stat:
    path: "{{ nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.cert.pem' }}"
  register: nomad_cli_cert_stat

- name: Set nomad_protocol fact
  ansible.builtin.set_fact:
    nomad_protocol: "{{ \"https\" if nomad_cli_cert_stat.stat.exists else \"http\" }}"

- name: Prune Docker system to free space
  ansible.builtin.command: docker system prune --force --volumes
  become: yes
  ignore_errors: yes

- name: Build last30days_service Docker image
  community.docker.docker_image:
    name: last30days-service
    tag: local
    build:
      path: "{{ project_root }}/last30days_service"
      nocache: true
    source: build
    force_source: true
  become: yes

- name: Export last30days_service image and pin to IPFS
  ansible.builtin.shell: docker save last30days-service:local | ipfs add -Q -
  become: yes
  register: ipfs_add_result
  environment:
    IPFS_PATH: "{{ ipfs_path }}"

- name: Set last30days_service_ipfs_cid fact
  ansible.builtin.set_fact:
    last30days_service_ipfs_cid: "{{ ipfs_add_result.stdout }}"

- name: Run last30days_service job
  ansible.builtin.template:
    src: last30days.nomad.j2
    dest: "{{ nomad_jobs_dir }}/last30days.nomad"
  notify:
    - Run last30days job
