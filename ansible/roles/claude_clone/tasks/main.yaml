- name: Clone Claude_Clone repository
  ansible.builtin.git:
    repo: 'https://github.com/LokiMetaSmith/Claude_Clone.git'
    dest: /opt/claude_clone
    version: main
    force: yes

- name: Fix tree-sitter-c-sharp version
  ansible.builtin.replace:
    path: /opt/claude_clone/package.json
    regexp: '"tree-sitter-c-sharp": "\^0\.20\.0"'
    replace: '"tree-sitter-c-sharp": "^0.23.5"'

- name: Install Claude_Clone dependencies
  ansible.builtin.npm:
    path: /opt/claude_clone
    state: present

- name: Build Claude_Clone project
  ansible.builtin.command:
    cmd: npm run build
    chdir: /opt/claude_clone
  changed_when: true
