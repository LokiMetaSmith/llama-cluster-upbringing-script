# Ensure IPFS CLI is installed
- name: Check if Nomad CLI cert exists
  ansible.builtin.stat:
    path: "{{ nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.cert.pem' }}"
  register: nomad_cli_cert_stat

- name: Set nomad_protocol fact
  ansible.builtin.set_fact:
    nomad_protocol: "{{ \"https\" if nomad_cli_cert_stat.stat.exists else \"http\" }}"

- name: Check if IPFS CLI is installed
  ansible.builtin.stat:
    path: /usr/local/bin/ipfs
  register: ipfs_binary

- name: Check IPFS version if installed
  ansible.builtin.command: /usr/local/bin/ipfs --version
  register: ipfs_version
  changed_when: false
  failed_when: false
  when: ipfs_binary.stat.exists

- name: Install IPFS CLI
  block:
    - name: Download kubo (IPFS CLI)
      ansible.builtin.get_url:
        url: "https://dist.ipfs.tech/kubo/v0.41.0/kubo_v0.41.0_linux-amd64.tar.gz"
        dest: "/tmp/kubo.tar.gz"
        mode: '0644'

    - name: Extract kubo
      ansible.builtin.unarchive:
        src: "/tmp/kubo.tar.gz"
        dest: "/tmp/"
        remote_src: yes

    - name: Move ipfs binary to /usr/local/bin
      ansible.builtin.copy:
        src: "/tmp/kubo/ipfs"
        dest: "/usr/local/bin/ipfs"
        mode: '0755'
        remote_src: yes

    - name: Clean up temporary files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/kubo.tar.gz"
        - "/tmp/kubo"
  become: yes
  when: not ipfs_binary.stat.exists or (ipfs_version is defined and ipfs_version.stdout is defined and '0.41.0' not in ipfs_version.stdout)


- name: Determine node hostname for IPFS directory
  ansible.builtin.set_fact:
    ipfs_node_name: "{{ ansible_nodename | default(ansible_hostname | default(ansible_facts.get('nodename', ansible_facts.get('hostname', inventory_hostname)))) }}"

- name: Get system hostname if not present in facts or is localhost
  ansible.builtin.command: hostname
  register: system_hostname_cmd
  changed_when: false
  when: ipfs_node_name == 'localhost' or ipfs_node_name is not defined or not ipfs_node_name

- name: Set definitive ipfs_node_name
  ansible.builtin.set_fact:
    ipfs_node_name: "{{ system_hostname_cmd.stdout | trim }}"
  when: system_hostname_cmd is defined and system_hostname_cmd.stdout is defined and system_hostname_cmd.stdout | trim != ''

- name: Ensure IPFS node-specific data directories exist
  ansible.builtin.file:
    path: "/opt/unified_fs_backend/ipfs/{{ ipfs_node_name }}"
    state: directory
    mode: '0755'
    owner: "1000"
    group: "100"
  become: yes

- name: Migrate data from existing alias directories if they are real directories
  ansible.builtin.shell: |
    set -e
    if [ -d "/opt/unified_fs_backend/ipfs/{{ item }}" ] && [ ! -L "/opt/unified_fs_backend/ipfs/{{ item }}" ]; then
      if rsync -a --remove-source-files "/opt/unified_fs_backend/ipfs/{{ item }}/" "/opt/unified_fs_backend/ipfs/{{ ipfs_node_name }}/"; then
        find "/opt/unified_fs_backend/ipfs/{{ item }}" -type d -empty -delete
        rm -rf "/opt/unified_fs_backend/ipfs/{{ item }}"
        echo "Migrated"
      else
        echo "Failed to migrate" >&2
        exit 1
      fi
    else
      echo "Skipped"
    fi
  loop: "{{ [inventory_hostname, 'localhost'] | unique | reject('equalto', ipfs_node_name) | list }}"
  become: yes
  register: ipfs_migration_result
  changed_when: "'Migrated' in ipfs_migration_result.stdout"


- name: Ensure IPFS node directory symlink for inventory aliases
  ansible.builtin.file:
    src: "/opt/unified_fs_backend/ipfs/{{ ipfs_node_name }}"
    dest: "/opt/unified_fs_backend/ipfs/{{ item }}"
    state: link
    force: yes
  loop: "{{ [inventory_hostname, 'localhost'] | unique | reject('equalto', ipfs_node_name) | list }}"
  become: yes

- name: Initialize IPFS repository on host
  ansible.builtin.command: /usr/local/bin/ipfs init --profile server,local-discovery
  args:
    creates: "/opt/unified_fs_backend/ipfs/{{ ipfs_node_name }}/config"
  environment:
    IPFS_PATH: "/opt/unified_fs_backend/ipfs/{{ ipfs_node_name }}"
  become: yes

- name: Configure IPFS Addresses.API to listen on 0.0.0.0
  ansible.builtin.command: /usr/local/bin/ipfs config Addresses.API "/ip4/0.0.0.0/tcp/{{ ipfs_api_port | default(5001) }}"
  environment:
    IPFS_PATH: "/opt/unified_fs_backend/ipfs/{{ ipfs_node_name }}"
  become: yes

- name: Configure IPFS Addresses.Gateway to listen on 0.0.0.0
  ansible.builtin.command: /usr/local/bin/ipfs config Addresses.Gateway "/ip4/0.0.0.0/tcp/{{ ipfs_gateway_port | default(8092) }}"
  environment:
    IPFS_PATH: "/opt/unified_fs_backend/ipfs/{{ ipfs_node_name }}"
  become: yes

- name: Set IPFS directory ownership for Kubo container
  ansible.builtin.file:
    path: "/opt/unified_fs_backend/ipfs/{{ ipfs_node_name }}"
    owner: "1000"
    group: "100"
    recurse: yes
  become: yes

- name: Remove stale IPFS lock files before starting daemon
  ansible.builtin.file:
    path: "/opt/unified_fs_backend/ipfs/{{ ipfs_node_name }}/{{ item }}"
    state: absent
  loop:
    - "repo.lock"
    - "api"
  become: yes

- name: Validate existing IPFS repository for native migration
  block:
    - name: Run IPFS repo verify
      ansible.builtin.command: /usr/local/bin/ipfs repo verify
      environment:
        IPFS_PATH: "/opt/unified_fs_backend/ipfs/{{ ipfs_node_name }}"
      register: ipfs_verify_result
      changed_when: "'verify successful' in ipfs_verify_result.stdout"
  rescue:
    - name: Log verify failure
      ansible.builtin.debug:
        msg: "IPFS repo verify failed with return code {{ ipfs_verify_result.rc | default('unknown') }}: {{ ipfs_verify_result.stderr | default(ipfs_verify_result.msg | default('Unknown error')) }}"
    - name: Fail task due to IPFS repo corruption
      ansible.builtin.fail:
        msg: "Failed to validate IPFS repo. Migration cannot safely proceed."
  become: yes

- name: Set IPFS directory ownership for native execution
  ansible.builtin.file:
    path: "/opt/unified_fs_backend/ipfs/{{ ipfs_node_name }}"
    owner: "1000"
    group: "100"
    recurse: yes
  become: yes

- name: Template ipfs job
  ansible.builtin.template:
    src: ipfs.nomad.j2
    dest: "{{ nomad_jobs_dir }}/ipfs.nomad"
  become: yes

- name: Run ipfs job
  ansible.builtin.command:
    cmd: /usr/local/bin/nomad job run -detach {{ nomad_jobs_dir }}/ipfs.nomad
  environment:
    NOMAD_ADDR: "{{ nomad_protocol | default('https') }}://{{ cluster_ip | default('127.0.0.1') }}:{{ nomad_http_port | default(4646) }}"
    NOMAD_CACERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/ca.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
    NOMAD_CLIENT_CERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.cert.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
    NOMAD_CLIENT_KEY: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.key.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
  register: nomad_job_run

- name: Allow IPFS ports in UFW
  ansible.builtin.command: ufw allow {{ item }}/tcp
  loop:
    - "{{ ipfs_swarm_port | default(4001) }}"
    - "{{ ipfs_api_port | default(5001) }}"
    - "{{ ipfs_gateway_port | default(8092) }}"
  become: yes
  changed_when: false
  ignore_errors: yes

- name: Allow IPFS API from Tailscale interface
  community.general.ufw:
    rule: allow
    port: "{{ ipfs_api_port | default('5001') }}"
    proto: tcp
    interface: tailscale0
    direction: in
  become: yes
  ignore_errors: yes

- name: Flush handlers to ensure ipfs service is started
  ansible.builtin.meta: flush_handlers

- name: Check IPFS Nomad job status
  ansible.builtin.command: /usr/local/bin/nomad job status ipfs
  environment:
    NOMAD_ADDR: "{{ nomad_protocol | default('https') }}://{{ cluster_ip | default('127.0.0.1') }}:{{ nomad_http_port | default(4646) }}"
    NOMAD_CACERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/ca.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
    NOMAD_CLIENT_CERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.cert.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
    NOMAD_CLIENT_KEY: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.key.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
  register: ipfs_nomad_status
  failed_when: false
  changed_when: false

- name: Wait for IPFS API to be ready
  block:
    - name: Wait for IPFS API to be ready
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ ipfs_api_port | default(5001) }}"
        delay: 5
        timeout: 120
        state: started
  rescue:
    - name: Diagnose IPFS Nomad job status
      ansible.builtin.command: /usr/local/bin/nomad job status ipfs
      environment:
        NOMAD_ADDR: "{{ nomad_protocol | default('https') }}://{{ cluster_ip | default('127.0.0.1') }}:{{ nomad_http_port | default(4646) }}"
        NOMAD_CACERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/ca.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
        NOMAD_CLIENT_CERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.cert.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
        NOMAD_CLIENT_KEY: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.key.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
      register: ipfs_job_status
      failed_when: false
      changed_when: false

    - name: Get Latest Alloc ID
      ansible.builtin.shell: "echo '{{ ipfs_job_status.stdout }}' | awk '/Allocations/{flag=1; next} flag && NF > 0 { if ($1 != \"ID\") {print $1; exit} }'"
      register: ipfs_latest_alloc_id
      failed_when: false
      changed_when: false

    - name: Diagnose Latest Alloc Status
      ansible.builtin.command: /usr/local/bin/nomad alloc status {{ ipfs_latest_alloc_id.stdout }}
      environment:
        NOMAD_ADDR: "{{ nomad_protocol | default('https') }}://{{ cluster_ip | default('127.0.0.1') }}:{{ nomad_http_port | default(4646) }}"
        NOMAD_CACERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/ca.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
        NOMAD_CLIENT_CERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.cert.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
        NOMAD_CLIENT_KEY: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.key.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
      register: ipfs_alloc_status
      failed_when: false
      changed_when: false
      when: ipfs_latest_alloc_id.stdout != ""

    - name: Diagnose Latest Alloc Logs
      ansible.builtin.command: /usr/local/bin/nomad alloc logs -stderr {{ ipfs_latest_alloc_id.stdout }}
      environment:
        NOMAD_ADDR: "{{ nomad_protocol | default('https') }}://{{ cluster_ip | default('127.0.0.1') }}:{{ nomad_http_port | default(4646) }}"
        NOMAD_CACERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/ca.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
        NOMAD_CLIENT_CERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.cert.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
        NOMAD_CLIENT_KEY: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.key.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
      register: ipfs_alloc_logs
      failed_when: false
      changed_when: false
      when: ipfs_latest_alloc_id.stdout != ""

    - name: Log Diagnoses
      ansible.builtin.debug:
        msg: |
          Job Status:
          {{ ipfs_job_status.stdout | default('No job status') }}

          Alloc Status:
          {{ ipfs_alloc_status.stdout | default('No alloc status') }}

          Alloc Logs:
          {{ ipfs_alloc_logs.stdout | default('No alloc logs') }}

    - name: Fail task due to IPFS API timeout
      ansible.builtin.fail:
        msg: "Timeout waiting for IPFS API to be ready on 127.0.0.1:{{ ipfs_api_port | default(5001) }}"


- name: Wait for IPFS Gateway to be fully ready
  block:
    - name: Wait for IPFS Gateway to be fully ready
      ansible.builtin.uri:
        url: "http://{{ cluster_ip | default('127.0.0.1') }}:{{ ipfs_gateway_port | default(8092) }}/"
        return_content: yes
        status_code: [200, 400, 403, 404, 502, 504, -1]
      register: ipfs_gateway_status
      until: ipfs_gateway_status.status is defined and ipfs_gateway_status.status in [200, 400, 403, 404]
      failed_when: false
      retries: 6
      delay: 10

    - name: Check Gateway Status Success
      ansible.builtin.fail:
        msg: "Gateway failed to start properly. Status: {{ ipfs_gateway_status.status | default('unknown') }}"
      when: "not (ipfs_gateway_status.status is defined and ipfs_gateway_status.status in [200, 400, 403, 404])"
  rescue:
    - name: Diagnose IPFS Nomad job status
      ansible.builtin.command: /usr/local/bin/nomad job status ipfs
      environment:
        NOMAD_ADDR: "{{ nomad_protocol | default('https') }}://{{ cluster_ip | default('127.0.0.1') }}:{{ nomad_http_port | default(4646) }}"
        NOMAD_CACERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/ca.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
        NOMAD_CLIENT_CERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.cert.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
        NOMAD_CLIENT_KEY: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.key.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
      register: ipfs_job_status
      failed_when: false
      changed_when: false

    - name: Get Latest Alloc ID
      ansible.builtin.shell: "echo '{{ ipfs_job_status.stdout }}' | awk '/Allocations/{flag=1; next} flag && NF > 0 { if ($1 != \"ID\") {print $1; exit} }'"
      register: ipfs_latest_alloc_id
      failed_when: false
      changed_when: false

    - name: Diagnose Latest Alloc Status
      ansible.builtin.command: /usr/local/bin/nomad alloc status {{ ipfs_latest_alloc_id.stdout }}
      environment:
        NOMAD_ADDR: "{{ nomad_protocol | default('https') }}://{{ cluster_ip | default('127.0.0.1') }}:{{ nomad_http_port | default(4646) }}"
        NOMAD_CACERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/ca.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
        NOMAD_CLIENT_CERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.cert.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
        NOMAD_CLIENT_KEY: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.key.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
      register: ipfs_alloc_status
      failed_when: false
      changed_when: false
      when: ipfs_latest_alloc_id.stdout != ""

    - name: Diagnose Latest Alloc Logs
      ansible.builtin.command: /usr/local/bin/nomad alloc logs -stderr {{ ipfs_latest_alloc_id.stdout }}
      environment:
        NOMAD_ADDR: "{{ nomad_protocol | default('https') }}://{{ cluster_ip | default('127.0.0.1') }}:{{ nomad_http_port | default(4646) }}"
        NOMAD_CACERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/ca.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
        NOMAD_CLIENT_CERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.cert.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
        NOMAD_CLIENT_KEY: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.key.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
      register: ipfs_alloc_logs
      failed_when: false
      changed_when: false
      when: ipfs_latest_alloc_id.stdout != ""

    - name: Log Diagnoses
      ansible.builtin.debug:
        msg: |
          Job Status:
          {{ ipfs_job_status.stdout | default('No job status') }}

          Alloc Status:
          {{ ipfs_alloc_status.stdout | default('No alloc status') }}

          Alloc Logs:
          {{ ipfs_alloc_logs.stdout | default('No alloc logs') }}

    - name: Fail task due to IPFS Gateway timeout
      ansible.builtin.fail:
        msg: "Timeout waiting for IPFS Gateway to be fully ready"


- name: Deploy automated IPFS P2P model pinning script
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # IPFS Automated P2P Model Pinning Script
      # Scans our shared NFS models directory and pins all model files locally via --nocopy.

      MODELS_DIR="{{ nomad_models_dir }}"
      IPFS_PATH="{{ ipfs_path }}"
      export IPFS_PATH
      export PATH=$PATH:/usr/local/bin

      if [ ! -d "$MODELS_DIR" ]; then
          echo "Models directory $MODELS_DIR does not exist. Skipping."
          exit 0
      fi

      echo "Starting automated IPFS model pinning..."
      find "$MODELS_DIR" -type f | while IFS= read -r filepath; do
          # Skip temporary or hidden files
          if [[ "$(basename "$filepath")" =~ ^\. ]] || [[ "$filepath" == *"/tmp/"* ]]; then
              continue
          fi

          echo "Pinning $filepath..."
          # Pin via --nocopy so IPFS doesn't duplicate the bytes
          ipfs add --nocopy -Q "$filepath"
      done

      echo "Automated IPFS model pinning complete."
    dest: /usr/local/bin/ipfs_p2p_pin_models.sh
    mode: '0755'
    owner: root
    group: root
  become: yes

- name: Configure daily 3:00 AM automated IPFS P2P pinning cron job
  ansible.builtin.cron:
    name: "Daily IPFS P2P model pinning"
    minute: "0"
    hour: "3"
    job: "/bin/bash /usr/local/bin/ipfs_p2p_pin_models.sh >/dev/null 2>&1"
    user: "root"
  become: yes

- name: Configure daily 4:00 AM automated IPFS GC cron job
  ansible.builtin.cron:
    name: "Daily IPFS GC"
    minute: "0"
    hour: "4"
    job: "IPFS_PATH=\"/opt/unified_fs_backend/ipfs/{{ ipfs_node_name }}\" /usr/local/bin/ipfs repo gc >/dev/null 2>&1"
    user: "root"
  become: yes
