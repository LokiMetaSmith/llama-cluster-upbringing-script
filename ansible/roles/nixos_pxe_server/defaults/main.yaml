---
# defaults/main.yaml for nixos_pxe_server

# Network interface to bind PXE/DHCP services.
# Automatically detected per machine via ansible_default_ipv4 or active interfaces if not overridden.
pxe_interface: "{{ ansible_default_ipv4.interface | default('eth0') }}"
cluster_ip: "{{ pxe_server_ip | default('192.168.1.148') }}"
