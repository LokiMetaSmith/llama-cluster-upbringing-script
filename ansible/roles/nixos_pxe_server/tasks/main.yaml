- name: Ensure network facts are gathered
  ansible.builtin.setup:
    gather_subset:
      - network
  when: ansible_interfaces is not defined

- name: Auto-detect PXE network interface per machine
  ansible.builtin.set_fact:
    pxe_interface: >-
      {%- set matching_iface = namespace(name='') -%}
      {%- if pxe_interface is defined and pxe_interface | string | length > 0 and pxe_interface in (ansible_interfaces | default([])) -%}
        {{ pxe_interface }}
      {%- else -%}
        {%- if pxe_server_ip is defined and pxe_server_ip in (ansible_all_ipv4_addresses | default([])) -%}
          {%- for iface in ansible_interfaces | default([]) -%}
            {%- set iface_key = 'ansible_' + (iface | replace('-', '_')) -%}
            {%- set iface_data = hostvars[inventory_hostname][iface_key] | default({}) -%}
            {%- if iface_data.ipv4 is defined and iface_data.ipv4.address == pxe_server_ip -%}
              {%- set matching_iface.name = iface -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {%- if matching_iface.name != '' -%}
          {{ matching_iface.name }}
        {%- elif ansible_default_ipv4.interface is defined and ansible_default_ipv4.interface | string | length > 0 -%}
          {{ ansible_default_ipv4.interface }}
        {%- else -%}
          {{ (ansible_interfaces | default([]) | reject('equalto', 'lo') | first) | default('eth0') }}
        {%- endif -%}
      {%- endif -%}

- name: Display detected PXE interface
  ansible.builtin.debug:
    msg: "Configuring NixOS PXE server on interface '{{ pxe_interface }}' for host '{{ inventory_hostname }}'"

- name: Ensure web root directory exists
  ansible.builtin.file:
    path: /var/www
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Copy NixOS configuration to server
  ansible.builtin.template:
    src: configuration.nix.j2
    dest: /etc/nixos/configuration.nix
    owner: root
    group: root
    mode: '0644'
  become: yes
  notify: Rebuild NixOS

- name: Copy NixOS iPXE boot script to web root
  ansible.builtin.template:
    src: boot.ipxe.nix.j2
    dest: /var/www/boot.ipxe
    owner: root
    group: root
    mode: '0644'
  become: yes

# This meta task ensures that the 'Rebuild NixOS' handler is called
# immediately after the config is changed, rather than at the end of the play.
- name: Apply NixOS configuration if changed
  ansible.builtin.meta: flush_handlers
