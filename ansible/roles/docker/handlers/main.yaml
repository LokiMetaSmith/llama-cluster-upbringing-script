# handlers file for docker

- name: Restart Docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
  become: true

- name: Restart Docker Prune Timer
  ansible.builtin.systemd:
    name: docker-prune.timer
    state: restarted
    daemon_reload: yes
  when: not ansible_check_mode
  become: true
