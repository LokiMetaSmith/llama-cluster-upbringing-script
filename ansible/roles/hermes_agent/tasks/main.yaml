- name: Check if hermes command is already installed
  ansible.builtin.shell: command -v hermes
  register: hermes_check
  ignore_errors: yes
  changed_when: false

- name: Remove stale git lock files in hermes-agent to prevent git update failures
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "/home/{{ target_user | default('pipecatapp') }}/.hermes/hermes-agent/.git/HEAD.lock"
    - "/home/{{ target_user | default('pipecatapp') }}/.hermes/hermes-agent/.git/index.lock"
  become: yes
  become_user: "{{ target_user | default('pipecatapp') }}"

- name: Install Hermes Agent
  ansible.builtin.shell:
    cmd: "curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-setup"
  when: hermes_check.rc != 0
  become: yes
  become_user: "{{ target_user | default('pipecatapp') }}"
  register: hermes_install
  changed_when: "'Installation Complete' in hermes_install.stdout"

- name: Ensure ~/.local/bin is on PATH for target user
  ansible.builtin.lineinfile:
    path: "/home/{{ target_user | default('pipecatapp') }}/.bashrc"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    state: present
  become: yes
  become_user: "{{ target_user | default('pipecatapp') }}"

- name: Ensure Apptainer and workspace directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ target_user | default('pipecatapp') }}"
  with_items:
    - "/opt/apptainer/images"
    - "{{ hermes_workspace_dir | default('/var/lib/openclaw/workspace') }}"
    - "/home/{{ target_user | default('pipecatapp') }}/.hermes"
  become: yes

- name: Deploy Hermes Agent configuration with Apptainer backend
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "/home/{{ target_user | default('pipecatapp') }}/.hermes/config.yaml"
    mode: "0644"
    owner: "{{ target_user | default('pipecatapp') }}"
  become: yes

- name: Check if Hermes Apptainer SIF image exists
  ansible.builtin.stat:
    path: "{{ hermes_apptainer_image_path | default('/opt/apptainer/images/hermes_sandbox.sif') }}"
  register: hermes_sif_stat

- name: Build/Pull default Hermes Apptainer SIF image if missing
  ansible.builtin.shell:
    cmd: "apptainer build {{ hermes_apptainer_image_path | default('/opt/apptainer/images/hermes_sandbox.sif') }} docker://python:3.11-slim"
  when:
    - not hermes_sif_stat.stat.exists
    - hermes_pull_sif | default(true) | bool
  ignore_errors: yes
  become: yes
