- name: Check for empty management token file
  stat:
    path: "{{ consul_config_dir }}/management_token"
  register: token_stat
  become: yes

- name: Remove empty management token file
  file:
    path: "{{ consul_config_dir }}/management_token"
    state: absent
  when: token_stat.stat.exists and token_stat.stat.size == 0
  become: yes

- name: Bootstrap ACLs and recover from failures
  block:
    - name: Bootstrap ACLs
      block:
        - name: Bootstrap ACLs
          command: "consul acl bootstrap"
          args:
            creates: "{{ consul_config_dir }}/management_token"
          register: acl_bootstrap_result
          changed_when: "'SecretID:' in acl_bootstrap_result.stdout"
          become: yes

        - name: Extract SecretID from bootstrap
          set_fact:
            consul_bootstrap_secret_id: "{{ (acl_bootstrap_result.stdout | regex_search('SecretID:\\s+([^\\n]+)', '\\1') or []) | first }}"
          when: acl_bootstrap_result.changed and 'SecretID:' in acl_bootstrap_result.stdout

        - name: Store management token
          copy:
            content: "{{ consul_bootstrap_secret_id }}"
            dest: "{{ consul_config_dir }}/management_token"
            mode: '0600'
          when: acl_bootstrap_result.changed and consul_bootstrap_secret_id is defined and consul_bootstrap_secret_id | length > 0
          become: yes
      when: "'controller_nodes' in groups and groups['controller_nodes'] | length > 0"
      run_once: true
      delegate_to: "{{ groups['controller_nodes'][0] }}"
  rescue:
    - name: Recover from failed ACL bootstrap
      block:
        - name: Combine stdout and stderr from failed result
          set_fact:
            combined_acl_output: "{{ (ansible_failed_result.stdout | default('')) ~ ' ' ~ (ansible_failed_result.stderr | default('')) }}"

        - name: Fail if recovery is not possible
          fail:
            msg: "ACL bootstrap failed with an unrecoverable error: {{ ansible_failed_result }}"
          when: "'ACL bootstrap no longer allowed' not in combined_acl_output"

        - name: Extract reset index
          set_fact:
            consul_acl_reset_index: "{{ (combined_acl_output | regex_search('reset index: (\\d+)', '\\1') or ['']) | first }}"

        - name: Fail if reset index not found
          fail:
            msg: "Could not find reset index in the error message: {{ combined_acl_output }}"
          when: consul_acl_reset_index is not defined or consul_acl_reset_index | length == 0

        - name: Stop Consul service
          systemd:
            name: consul
            state: stopped
          become: yes

        - name: Write reset index to acl-bootstrap-reset file
          copy:
            content: "{{ consul_acl_reset_index }}\n"
            dest: "{{ consul_data_dir }}/acl-bootstrap-reset"
            owner: consul
            group: consul
            mode: '0644'
          become: yes

        - name: Restart Consul service
          systemd:
            name: consul
            state: restarted
          become: yes

        - name: Wait for Consul API to be ready after recovery
          uri:
            url: "https://{{ advertise_ip }}:{{ consul_https_port }}/v1/status/leader"
            client_cert: "{{ consul_config_dir | default('/etc/consul.d') }}/cert.pem"
            client_key: "{{ consul_config_dir | default('/etc/consul.d') }}/key.pem"
            ca_path: "/etc/consul.d/ca.pem"
          register: consul_status_recovery
          until: consul_status_recovery.status is defined and consul_status_recovery.status == 200
          retries: 30
          delay: 5

        - name: Retry ACL bootstrap
          command: "consul acl bootstrap"
          register: acl_bootstrap_result_recovery
          become: yes

        - name: "Debug: Display ACL bootstrap recovery output"
          debug:
            msg:
              - "STDOUT: {{ acl_bootstrap_result_recovery.stdout }}"
              - "STDERR: {{ acl_bootstrap_result_recovery.stderr }}"

        - name: Extract SecretID from recovery
          set_fact:
            consul_recovery_secret_id: "{{ (acl_bootstrap_result_recovery.stdout | regex_search('SecretID:\\s+([^\\n]+)', '\\1') or []) | first }}"
          when: "'SecretID:' in acl_bootstrap_result_recovery.stdout"

        - name: Store recovered management token
          copy:
            content: "{{ consul_recovery_secret_id }}"
            dest: "{{ consul_config_dir }}/management_token"
            mode: '0600'
          when: consul_recovery_secret_id is defined and consul_recovery_secret_id | length > 0
          become: yes
      delegate_to: "{{ groups['controller_nodes'][0] }}"
      run_once: true
