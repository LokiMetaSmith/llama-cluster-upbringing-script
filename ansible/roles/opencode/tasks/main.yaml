- name: Install opencode-ai via npm
  community.general.npm:
    name: opencode-ai
    global: yes
    state: latest
  become: yes

- name: Find opencode binary path
  ansible.builtin.command: npm prefix -g
  register: opencode_npm_prefix_path
  changed_when: false
  become: yes

- name: Set opencode binary path
  ansible.builtin.set_fact:
    opencode_bin_path: "{{ opencode_npm_prefix_path.stdout }}/bin/opencode"

- name: Proactively terminate any existing opencode processes
  ansible.builtin.shell: pkill -9 -x "opencode" || pkill -9 -f "bin/opencode"
  failed_when: false
  changed_when: true
  become: yes

- name: Create Opencode Nomad job file
  ansible.builtin.template:
    src: opencode.nomad.j2
    dest: /opt/nomad/jobs/opencode.nomad
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Check if Nomad CLI cert exists
  ansible.builtin.stat:
    path: "{{ nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.cert.pem' }}"
  register: nomad_cli_cert_stat

- name: Set nomad_protocol fact
  ansible.builtin.set_fact:
    nomad_protocol: "{{ \"https\" if nomad_cli_cert_stat.stat.exists else \"http\" }}"

- name: Run Opencode Nomad job asynchronously
  ansible.builtin.command:
    cmd: /usr/local/bin/nomad job run -detach /opt/nomad/jobs/opencode.nomad
  environment:
    NOMAD_ADDR: "{{ nomad_protocol | default('https') }}://{{ cluster_ip | default('127.0.0.1') }}:{{ nomad_http_port | default(4646) }}"
    NOMAD_CACERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/ca.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
    NOMAD_CLIENT_CERT: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.cert.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
    NOMAD_CLIENT_KEY: "{{ (nomad_tls_dir | default('/etc/nomad.d/tls') ~ '/cli.key.pem') if nomad_cli_cert_stat.stat.exists else omit }}"
  changed_when: true
