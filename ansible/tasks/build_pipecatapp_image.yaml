- name: Prune Docker system to free space
  ansible.builtin.command: docker system prune --force
  become: yes
  ignore_errors: yes

- name: Prune Docker builder cache
  ansible.builtin.command: docker builder prune --force
  become: yes
  ignore_errors: yes

- name: Copy pipecat startup script to build context
  ansible.builtin.template:
    src: "{{ pipecat_template_src | default(inventory_dir ~ '/ansible/roles/pipecatapp/templates/start_pipecatapp.sh.j2') }}"
    dest: "{{ pipecat_build_dir | default(pipecat_app_dir) }}/start_pipecat.sh"
    mode: '0755'
  become: yes
  when: pipecat_deployment_style == 'docker'

- name: Get checksum of Dockerfile
  ansible.builtin.stat:
    path: "{{ pipecat_build_dir | default(pipecat_app_dir) }}/Dockerfile"
    checksum_algorithm: sha256
  register: dockerfile_stat
  become: yes
  when: pipecat_deployment_style == 'docker'

- name: Get checksum of requirements.txt
  ansible.builtin.stat:
    path: "{{ pipecat_build_dir | default(pipecat_app_dir) }}/requirements.txt"
    checksum_algorithm: sha256
  register: requirements_stat
  become: yes
  when: pipecat_deployment_style == 'docker'

- name: Get checksum of start_pipecat.sh
  ansible.builtin.stat:
    path: "{{ pipecat_build_dir | default(pipecat_app_dir) }}/start_pipecat.sh"
    checksum_algorithm: sha256
  register: startup_script_stat
  become: yes
  when: pipecat_deployment_style == 'docker'

- name: Generate build configuration hash
  ansible.builtin.set_fact:
    pipecat_build_hash: "{{ (dockerfile_stat.stat.checksum ~ requirements_stat.stat.checksum ~ startup_script_stat.stat.checksum) | hash('sha256') }}"
  when: pipecat_deployment_style == 'docker'

- name: Set versioned tag
  ansible.builtin.set_fact:
    pipecat_versioned_tag: "expert-{{ pipecat_build_hash }}"
  when: pipecat_deployment_style == 'docker'

- name: Check if versioned image exists locally
  ansible.builtin.command: "docker image inspect {{ pipecat_image_name | default('pipecatapp') }}:{{ pipecat_versioned_tag }}"
  register: versioned_image_check
  failed_when: false
  changed_when: false
  become: yes
  when: pipecat_deployment_style == 'docker'

- name: Build pipecatapp Docker image (if missing)
  community.docker.docker_image:
    name: "{{ pipecat_image_name | default('pipecatapp') }}"
    tag: "{{ pipecat_versioned_tag }}"
    build:
      path: "{{ pipecat_build_dir | default(pipecat_app_dir) }}"
      nocache: true
    source: build
    force_source: true
  register: build_result
  become: yes
  when: pipecat_deployment_style == 'docker' and versioned_image_check.rc != 0

- name: Tag image with stable tag
  ansible.builtin.command: "docker tag {{ pipecat_image_name | default('pipecatapp') }}:{{ pipecat_versioned_tag }} {{ pipecat_image_name | default('pipecatapp') }}:{{ pipecat_image_tag | default('local') }}"
  become: yes
  when: pipecat_deployment_style == 'docker'

- name: Export pipecatapp image to tarball
  ansible.builtin.command: "docker save -o /opt/{{ pipecat_image_name | default('pipecatapp') }}.tar {{ pipecat_image_name | default('pipecatapp') }}:{{ pipecat_versioned_tag }}"
  become: yes
  when: pipecat_deployment_style == 'docker'

- name: Ensure local IPFS data directory exists
  ansible.builtin.file:
    path: "{{ ipfs_path }}"
    state: directory
    mode: '0755'
  become: yes
  when: pipecat_deployment_style == 'docker'

- name: Initialize IPFS repository on host if needed
  ansible.builtin.command: /usr/local/bin/ipfs init --profile server,local-discovery
  args:
    creates: "{{ ipfs_path }}/config"
  environment:
    IPFS_PATH: "{{ ipfs_path }}"
  become: yes
  when: pipecat_deployment_style == 'docker'

- name: Pin pipecatapp tarball to IPFS and cleanup
  block:
    - name: Pin pipecatapp tarball to IPFS
      ansible.builtin.command: "ipfs add -Q /opt/{{ pipecat_image_name | default('pipecatapp') }}.tar"
      register: ipfs_add_result
      environment:
        IPFS_PATH: "{{ ipfs_path }}"

    - name: Set pipecatapp_ipfs_cid fact
      ansible.builtin.set_fact:
        pipecatapp_ipfs_cid: "{{ ipfs_add_result.stdout }}"
  always:
    - name: Clean up temporary tarball
      ansible.builtin.file:
        path: "/opt/{{ pipecat_image_name | default('pipecatapp') }}.tar"
        state: absent
  become: yes
  when: pipecat_deployment_style == 'docker'
