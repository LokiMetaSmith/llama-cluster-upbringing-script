[project]
name = "pipecatapp"
version = "0.1.0"
dependencies = [
    "cryptography>=41.0.0",
    "prometheus-client>=0.19.0",
    "mini-swe-agent>=0.1.0",
]

[tool.vulture]
exclude = ["venv", ".venv", "node_modules", "tests"]
ignore_decorators = ["@app.route", "@pytest.fixture"]
ignore_names = ["args", "kwargs"]
paths = ["pipecatapp", "scripts"]
