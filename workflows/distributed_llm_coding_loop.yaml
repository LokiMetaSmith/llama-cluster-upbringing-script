name: distributed_llm_coding_loop
description: A distributed multi-agent LLM coding workflow orchestrating Zero Point Modulator (ZPM capacity reconciliation), Keystone Polyphony (distributed swarm baton/mutex locks), and OpenJules (sandboxed autonomous coding agent).

global_mission: Execute distributed multi-agent software engineering task with ZPM capacity scaling, Polyphony baton locking, OpenJules sandboxed execution, and hard evidence verification.

nodes:
  - id: check_zpm_capacity
    type: ToolNode
    config:
      tool_name: zpm
      action: plan

  - id: broadcast_polyphony_intent
    type: ToolNode
    config:
      tool_name: polyphony
      action: share
      thought: "Initiating distributed LLM coding task via OpenJules with ZPM reconciled capacity."

  - id: acquire_file_baton
    type: ToolNode
    config:
      tool_name: polyphony
      action: baton_acquire
      resource: "src/critical_module.py"

  - id: dispatch_openjules_task
    type: ToolNode
    config:
      tool_name: openjules
      action: submit_task
      task: "Analyze failed unit tests, probe with reproduction scripts in sandbox, and apply patch."
      repository: "github:llama-cluster/distributed-coding"
      profile: "approved-coding"

  - id: release_file_baton
    type: ToolNode
    config:
      tool_name: polyphony
      action: baton_release
      resource: "src/critical_module.py"

  - id: record_evidence
    type: ToolNode
    config:
      tool_name: git_coordination
      action: append
      artifact: EVIDENCE
      project: distributed_llm_coding
      content: "Distributed LLM coding task executed via OpenJules and reconciled via ZPM under Polyphony baton concurrency control. All verification assertions passed."
