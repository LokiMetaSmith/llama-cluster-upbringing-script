- name: Redeploy the pipecat-app Nomad job
  hosts: controller_nodes
  become: yes
  vars_files:
    - "{{ ansible_config_file | dirname }}/group_vars/models.yaml"
  pre_tasks:
    - name: Ensure the target user exists
      ansible.builtin.user:
        name: "{{ target_user | default('pipecatapp') }}"
        state: present
        shell: /bin/bash
  roles:
    - role: pipecatapp
