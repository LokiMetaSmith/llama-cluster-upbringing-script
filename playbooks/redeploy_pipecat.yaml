- name: Redeploy the pipecat-app Nomad job
  hosts: controller_nodes, coordinator
  become: yes
  vars:
    target_user: "{{ target_user | default('pipecatapp') }}"
  vars_files:
    - "{{ ansible_config_file | dirname }}/group_vars/models.yaml"
  pre_tasks:
    - name: Ensure the target user 'nomad' exists
      ansible.builtin.user:
        name: "{{ target_user }}"
        state: present
        shell: /bin/bash
  roles:
    - role: pipecatapp
